services:
  - type: web
    name: endo-dent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.DentalClinicConfig.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
