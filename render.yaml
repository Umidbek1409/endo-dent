services:
  - type: web
    name: endo-dent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py compilemessages && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py create_default_admin
    startCommand: gunicorn config.DentalClinicConfig.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: ADMIN_USERNAME
        value: endo-dent
      - key: ADMIN_EMAIL
        value: admin@endo-dent.com
      - key: ADMIN_PASSWORD
        sync: false
